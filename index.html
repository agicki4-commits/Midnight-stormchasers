<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight: THE CHASERS</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>

    <!-- COIN BALANCE (shown on menus) -->
    <div id="coinBar" class="hidden"><span class="coin">🪙</span> <b id="coinAmt">0</b></div>

    <!-- MAIN MENU -->
    <div id="menu" class="screen">
      <div class="logo">
        <div class="logo-sub">MIDNIGHT</div>
        <div class="logo-main">THE&nbsp;CHASERS</div>
        <div class="logo-tag">Tornado Intercept Simulator</div>
      </div>
      <div class="btnrow">
        <button class="btn big" data-action="play">▶ PLAY</button>
        <button class="btn big ghost" data-action="shop">🛒 Buy Interceptors</button>
      </div>
      <div class="hint">A storm-chasing physics game — survive the vortex. Stronger tornadoes pay more coins.</div>
    </div>

    <!-- EF SELECT -->
    <div id="select" class="screen hidden">
      <h2>Choose Your Storm</h2>
      <div id="efGrid" class="ef-grid"></div>
      <div class="carinfo" id="activeInfo"></div>
      <button class="btn ghost" data-action="back">← Back</button>
    </div>

    <!-- SHOP -->
    <div id="shop" class="screen hidden">
      <h2>Buy Interceptors</h2>
      <div id="shopGrid" class="shop-grid"></div>
      <button class="btn ghost" data-action="back">← Back</button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hudStorm">EF0</div>
      <div id="hudWind">-- mph</div>
      <div id="hudPhase" class="phase">Driving to intercept point…</div>
    </div>

    <!-- SPACE PROMPT -->
    <div id="prompt" class="hidden"><span class="key">SPACE</span> Hunker down to the ground</div>

    <!-- RESULT -->
    <div id="result" class="screen hidden">
      <h2 id="resTitle">SURVIVED</h2>
      <p id="resText"></p>
      <div id="reward" class="reward hidden"></div>
      <div class="btnrow">
        <button class="btn" data-action="retry">↻ Retry</button>
        <button class="btn ghost" data-action="menu">Main Menu</button>
      </div>
    </div>
  </div>

  <script src="src/physics.js"></script>
  <script src="src/tornado.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
